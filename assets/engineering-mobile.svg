<svg xmlns="http://www.w3.org/2000/svg" width="600" height="365" viewBox="0 0 600 365" role="img" aria-labelledby="title desc"><title id="title">Adam Bates — software engineering</title><desc id="desc">I build services, device interfaces, and the tools to verify them. Distributed services, device integration, applied optimization.</desc><rect width="600" height="365" rx="14" fill="#0b161a"/><path d="M32 305H568" stroke="#30434a"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="47" fill="#8aebc2" font-size="15" letter-spacing="2">ADAM BATES / SOFTWARE ENGINEERING</text><text x="32" y="111" fill="#ecf2ef" font-size="39" font-weight="600">I build services,</text><text x="32" y="163" fill="#ecf2ef" font-size="39" font-weight="600">device interfaces, and</text><text x="32" y="215" fill="#8aebc2" font-size="39" font-weight="600">the tools to verify them.</text><text x="32" y="265" fill="#aec0c2" font-size="18">Java / Spring / Kafka · Python / Playwright</text><text x="32" y="338" fill="#aec0c2" font-size="17">Devices · Distributed services · Optimization</text></g></svg>
